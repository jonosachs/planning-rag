[project]
  name = "planning-rag"
  version = "0.1.0"
  requires-python = ">=3.13"
  dependencies = [
    "httpx",
    "beautifulsoup4",
    "google-genai",
    "python-dotenv",
    "chromadb",
    "pydantic",
  ]

[dependency-groups]
  dev = ["pytest", "ruff", "pyright"]

[tool.pytest.ini_options]
pythonpath = ["."]

